[project]
name = "langgraph-agent-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pablo Cueto", email = "cheffcueto@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.6",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.3",
]

[project.scripts]
langgraph-agent-tools = "langgraph_agent_tools:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
